name: Build SOFT.Connect.Desk

on:
  workflow_dispatch:
    inputs:
      role:
        description: Client role to build
        required: true
        default: all
        type: choice
        options:
          - support
          - operator
          - all
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - windows-x64
          - linux
          - macos
          - macos-diagnostic
      package:
        description: Package set to upload
        required: true
        default: all
        type: choice
        options:
          - all
          - portable
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_VERSION: "1.75.0"
  MAC_RUST_VERSION: "1.81.0"
  FLUTTER_VERSION: "3.24.5"
  ARM64_FLUTTER_VERSION: "3.44.9"
  BRIDGE_FLUTTER_VERSION: "3.22.3"
  VCPKG_COMMIT: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  BUILD_ROLE: ${{ github.event_name == 'workflow_dispatch' && inputs.role || 'all' }}

jobs:
  bridge:
    name: Generate Flutter bridge 3.22.3
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos-diagnostic'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Check locked Cargo dependencies
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Cache Rust bridge tools
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: soft-connect-bridge

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Generate bridge
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Test support service status
        working-directory: flutter
        run: flutter test --no-pub test/service_status_card_test.dart

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge
          retention-days: 7
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h

  bridge-windows-arm64:
    name: Generate Flutter bridge 3.44.9
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == 'macos'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake g++ libclang-dev libgtk-3-dev llvm-dev nasm ninja-build pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Rust bridge tools
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: soft-connect-bridge-windows-arm64

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.ARM64_FLUTTER_VERSION }}
          cache: true

      - name: Generate bridge
        shell: bash
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-windows-arm64
          retention-days: 7
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h

  windows:
    name: Windows x64
    needs: bridge
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == 'windows-x64'
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge
          path: .

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "15.0.6"

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch Flutter and install custom Windows engine
        shell: pwsh
        run: |
          $flutter = (Get-Command flutter.bat).Source
          $flutterRoot = Split-Path -Parent (Split-Path -Parent $flutter)
          $patch = Join-Path $env:GITHUB_WORKSPACE ".github\patches\flutter_3.24.4_dropdown_menu_enableFilter.diff"
          git -C $flutterRoot apply --check $patch 2>$null
          if ($LASTEXITCODE -eq 0) {
            git -C $flutterRoot apply $patch
          }
          flutter precache --windows
          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" `
            -OutFile "$env:RUNNER_TEMP\windows-x64-release.zip"
          $engineTemp = Join-Path $env:RUNNER_TEMP "windows-x64-release"
          Expand-Archive -Path "$env:RUNNER_TEMP\windows-x64-release.zip" -DestinationPath $engineTemp
          $engineTarget = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          Copy-Item -Path "$engineTemp\*" -Destination $engineTarget -Recurse -Force

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: soft-connect-windows

      - name: Export GitHub cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false

      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet=x64-windows-static `
            --host-triplet=x64-windows-static `
            "--x-install-root=$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows clients
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\soft-connect-cargo-target
        run: .github/scripts/build-windows.ps1 -Role $env:BUILD_ROLE

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build Windows MSI packages
        if: github.event_name != 'workflow_dispatch' || inputs.package != 'portable'
        shell: pwsh
        run: .github/scripts/build-windows-msi.ps1 -Role $env:BUILD_ROLE -Platform x64

      - name: Upload Windows artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.package != 'portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Windows-${{ env.BUILD_ROLE }}
          retention-days: 14
          path: dist/windows

      - name: Upload Windows portable test artifact
        if: github.event_name == 'workflow_dispatch' && inputs.package == 'portable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Windows-x64-${{ env.BUILD_ROLE }}-portable-test
          retention-days: 7
          path: |
            dist/windows/**/*Portable.exe
            dist/windows/**/*QS.exe
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64
    needs: bridge-windows-arm64
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-11-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore ARM64 bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-windows-arm64
          path: .

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: "15.0.6"

      - name: Install Flutter 3.44
        id: flutter-arm64
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.ARM64_FLUTTER_VERSION }}
          architecture: x64

      - name: Activate native ARM64 Dart and Flutter engine
        shell: pwsh
        run: |
          $flutterRoot = "${{ steps.flutter-arm64.outputs['CACHE-PATH'] }}"
          Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
          & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
          & "$flutterRoot\bin\flutter.bat" precache --windows
          $dartVersion = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVersion
          if ($dartVersion -notmatch "windows_arm64") {
            throw "Expected native windows_arm64 Dart SDK"
          }

      - name: Patch sources for Flutter 3.44
        shell: bash
        run: bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: soft-connect-windows-arm64

      - name: Export GitHub cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false

      - name: Install native ARM64 dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet=arm64-windows-static `
            --host-triplet=arm64-windows-static `
            "--x-install-root=$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "SODIUM_LIB_DIR=$env:VCPKG_ROOT\installed\arm64-windows-static\lib" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows ARM64 clients
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}\soft-connect-cargo-target
        run: .github/scripts/build-windows.ps1 -Role $env:BUILD_ROLE -Architecture arm64

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build Windows ARM64 MSI packages
        shell: pwsh
        run: .github/scripts/build-windows-msi.ps1 -Role $env:BUILD_ROLE -Platform ARM64

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Windows-ARM64-${{ env.BUILD_ROLE }}
          retention-days: 14
          path: dist/windows

  linux:
    name: Linux x64
    needs: bridge
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          docker system prune --all --force
          df -h

      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge
          path: .

      - name: Restore Linux build cache
        id: linux-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/soft-connect-linux-build/cargo-target
            ${{ runner.temp }}/soft-connect-linux-build/downloads
            ${{ runner.temp }}/soft-connect-linux-build/vcpkg-installed
            ${{ runner.temp }}/soft-connect-linux-build/pub-cache
          key: soft-connect-linux-x64-v1-${{ hashFiles('Cargo.lock', 'vcpkg.json', '.github/docker/linux/Dockerfile') }}
          restore-keys: |
            soft-connect-linux-x64-v1-

      - name: Build Linux clients
        shell: bash
        run: |
          docker build \
            --tag soft-connect-desk-linux-builder:${GITHUB_SHA} \
            .github/docker/linux
          mkdir -p "${RUNNER_TEMP}/soft-connect-linux-build" "${GITHUB_WORKSPACE}/dist/linux"
          case "${BUILD_ROLE}" in
            support) roles=(support) ;;
            operator) roles=(operator) ;;
            all) roles=(support operator) ;;
            *) echo "Unknown role: ${BUILD_ROLE}" >&2; exit 2 ;;
          esac
          for role in "${roles[@]}"; do
            docker run --rm \
              --env "ROLE=${role}" \
              --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
              --mount "type=bind,source=${RUNNER_TEMP}/soft-connect-linux-build,target=/build" \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/dist/linux,target=/out" \
              "soft-connect-desk-linux-builder:${GITHUB_SHA}"
          done

      - name: Save Linux build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/soft-connect-linux-build/cargo-target
            ${{ runner.temp }}/soft-connect-linux-build/downloads
            ${{ runner.temp }}/soft-connect-linux-build/vcpkg-installed
            ${{ runner.temp }}/soft-connect-linux-build/pub-cache
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Linux-${{ env.BUILD_ROLE }}
          retention-days: 14
          path: dist/linux

  linux-arm64:
    name: Linux ARM64
    needs: bridge
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Free runner disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/lib/android /usr/share/dotnet
          docker system prune --all --force
          df -h

      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge
          path: .

      - name: Restore Linux ARM64 build cache
        id: linux-arm64-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/soft-connect-linux-arm64-build/cargo-target
            ${{ runner.temp }}/soft-connect-linux-arm64-build/downloads
            ${{ runner.temp }}/soft-connect-linux-arm64-build/vcpkg-installed
            ${{ runner.temp }}/soft-connect-linux-arm64-build/pub-cache
          key: soft-connect-linux-arm64-v1-${{ hashFiles('Cargo.lock', 'vcpkg.json', '.github/docker/linux/Dockerfile') }}
          restore-keys: |
            soft-connect-linux-arm64-v1-

      - name: Build Linux ARM64 clients
        shell: bash
        run: |
          docker build \
            --build-arg TARGETARCH=arm64 \
            --tag soft-connect-desk-linux-arm64-builder:${GITHUB_SHA} \
            .github/docker/linux
          mkdir -p "${RUNNER_TEMP}/soft-connect-linux-arm64-build" "${GITHUB_WORKSPACE}/dist/linux"
          case "${BUILD_ROLE}" in
            support) roles=(support) ;;
            operator) roles=(operator) ;;
            all) roles=(support operator) ;;
            *) echo "Unknown role: ${BUILD_ROLE}" >&2; exit 2 ;;
          esac
          for role in "${roles[@]}"; do
            docker run --rm \
              --env "ROLE=${role}" \
              --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
              --mount "type=bind,source=${RUNNER_TEMP}/soft-connect-linux-arm64-build,target=/build" \
              --mount "type=bind,source=${GITHUB_WORKSPACE}/dist/linux,target=/out" \
              "soft-connect-desk-linux-arm64-builder:${GITHUB_SHA}"
          done

      - name: Save Linux ARM64 build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/soft-connect-linux-arm64-build/cargo-target
            ${{ runner.temp }}/soft-connect-linux-arm64-build/downloads
            ${{ runner.temp }}/soft-connect-linux-arm64-build/vcpkg-installed
            ${{ runner.temp }}/soft-connect-linux-arm64-build/pub-cache
          key: ${{ steps.linux-arm64-cache.outputs.cache-primary-key }}

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Linux-ARM64-${{ env.BUILD_ROLE }}
          retention-days: 14
          path: dist/linux

  flatpak:
    name: Linux Flatpak x64
    needs:
      - bridge
      - linux
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: SOFT.Connect.Desk-Linux-${{ env.BUILD_ROLE }}
          path: dist/linux

      - name: Install Flatpak builder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libarchive-tools
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          git clone https://github.com/flathub/shared-modules.git flatpak/shared-modules --depth=1

      - name: Build Flatpak packages
        shell: bash
        run: |
          case "${BUILD_ROLE}" in
            support) roles=(Support) ;;
            operator) roles=(Operator) ;;
            all) roles=(Support Operator) ;;
            *) echo "Unknown role: ${BUILD_ROLE}" >&2; exit 2 ;;
          esac
          for role in "${roles[@]}"; do
            cp "dist/linux/SOFT.Connect.Desk-${role}-linux-x64.deb" \
              flatpak/soft-connect-desk.deb
            rm -rf flatpak/build flatpak/repo
            flatpak-builder \
              --user \
              --install-deps-from=flathub \
              -y \
              --force-clean \
              --repo=flatpak/repo \
              flatpak/build \
              flatpak/soft-connect-desk.json
            flatpak build-bundle \
              flatpak/repo \
              "dist/linux/SOFT.Connect.Desk-${role}-linux-x64.flatpak" \
              tech.salesof.SoftConnectDesk
          done
          cd dist/linux
          sha256sum ./*.flatpak > SHA256SUMS-Flatpak.txt

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Flatpak-${{ env.BUILD_ROLE }}
          retention-days: 14
          path: |
            dist/linux/*.flatpak
            dist/linux/SHA256SUMS-Flatpak.txt

  flatpak-arm64:
    name: Linux Flatpak ARM64
    needs:
      - bridge
      - linux-arm64
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download Linux ARM64 packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: SOFT.Connect.Desk-Linux-ARM64-${{ env.BUILD_ROLE }}
          path: dist/linux

      - name: Install Flatpak builder
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libarchive-tools
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          git clone https://github.com/flathub/shared-modules.git flatpak/shared-modules --depth=1

      - name: Build Flatpak ARM64 packages
        shell: bash
        run: |
          case "${BUILD_ROLE}" in
            support) roles=(Support) ;;
            operator) roles=(Operator) ;;
            all) roles=(Support Operator) ;;
            *) echo "Unknown role: ${BUILD_ROLE}" >&2; exit 2 ;;
          esac
          for role in "${roles[@]}"; do
            cp "dist/linux/SOFT.Connect.Desk-${role}-linux-aarch64.deb" \
              flatpak/soft-connect-desk.deb
            rm -rf flatpak/build flatpak/repo
            flatpak-builder \
              --user \
              --install-deps-from=flathub \
              -y \
              --force-clean \
              --repo=flatpak/repo \
              flatpak/build \
              flatpak/soft-connect-desk.json
            flatpak build-bundle \
              flatpak/repo \
              "dist/linux/SOFT.Connect.Desk-${role}-linux-aarch64.flatpak" \
              tech.salesof.SoftConnectDesk
          done
          cd dist/linux
          sha256sum ./*.flatpak > SHA256SUMS-Flatpak-ARM64.txt

      - name: Upload Flatpak ARM64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Flatpak-ARM64-${{ env.BUILD_ROLE }}
          retention-days: 14
          path: |
            dist/linux/*.flatpak
            dist/linux/SHA256SUMS-Flatpak-ARM64.txt

  archlinux:
    name: Arch Linux x64
    needs:
      - bridge
      - linux
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: SOFT.Connect.Desk-Linux-${{ env.BUILD_ROLE }}
          path: dist/linux

      - name: Build Arch Linux packages
        uses: rustdesk-org/arch-makepkg-action@04200739ed1d0bf6f2188b6736b26a767c57a7f9
        with:
          packages:
          scripts: >-
            bash -lc 'set -euo pipefail;
            case "${BUILD_ROLE}" in
              support) roles="Support" ;;
              operator) roles="Operator" ;;
              all) roles="Support Operator" ;;
              *) echo "Unknown role: ${BUILD_ROLE}" >&2; exit 2 ;;
            esac;
            workspace="$(pwd)";
            for role in ${roles}; do
              bundle="$(realpath "dist/linux/SOFT.Connect.Desk-${role}-linux-x64-bundle.tar.gz")";
              pushd res;
              HBB="${workspace}" SOFT_CONNECT_BUNDLE="${bundle}" makepkg -f --noconfirm;
              package="$(find . -maxdepth 1 -name "soft-connect-desk-*.pkg.tar.zst" -print -quit)";
              mv "${package}" "../dist/linux/SOFT.Connect.Desk-${role}-linux-x64.pkg.tar.zst";
              popd;
            done;
            cd dist/linux;
            sha256sum ./*.pkg.tar.zst > SHA256SUMS-ArchLinux.txt'

      - name: Upload Arch Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-ArchLinux-${{ env.BUILD_ROLE }}
          retention-days: 14
          path: |
            dist/linux/*.pkg.tar.zst
            dist/linux/SHA256SUMS-ArchLinux.txt

  macos:
    name: macOS ${{ matrix.arch }} ${{ matrix.role }}
    needs: [bridge, bridge-windows-arm64]
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - arm64
        role: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.role == 'all' && '["support","operator"]' || format('["{0}"]', inputs.role)) || '["support","operator"]') }}
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-26' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.arch == 'arm64' && 'bridge-windows-arm64' || 'bridge' }}
          path: .

      - name: Install native build tools
        shell: bash
        run: |
          brew install llvm pkg-config
          curl -fsSL \
            https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip \
            -o "${RUNNER_TEMP}/nasm.zip"
          unzip -q "${RUNNER_TEMP}/nasm.zip" -d "${RUNNER_TEMP}/nasm"
          sudo cp "${RUNNER_TEMP}/nasm/nasm-2.16.03/nasm" /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ matrix.arch == 'arm64' && env.ARM64_FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Patch sources for Flutter 3.44
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          flutter config --no-enable-swift-package-manager
          brew install gnu-sed
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Patch Flutter
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          flutter_root="$(cd "$(dirname "$(which flutter)")/.." && pwd)"
          patch_file="${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if git -C "${flutter_root}" apply --check "${patch_file}" 2>/dev/null; then
            git -C "${flutter_root}" apply "${patch_file}"
          fi
          sed -i.bak \
            's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' \
            "${flutter_root}/packages/flutter/lib/src/scheduler/binding.dart"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: ${{ matrix.arch == 'x86_64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: soft-connect-macos-${{ matrix.arch }}

      - name: Export GitHub cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          doNotCache: false

      - name: Install native dependencies
        shell: bash
        run: |
          "${VCPKG_ROOT}/vcpkg" install \
            --triplet="${{ matrix.arch == 'x86_64' && 'x64-osx' || 'arm64-osx' }}" \
            --host-triplet="${{ matrix.arch == 'x86_64' && 'x64-osx' || 'arm64-osx' }}" \
            --x-install-root="${VCPKG_ROOT}/installed"

      - name: Set minimum macOS version
        shell: bash
        run: |
          min="${{ matrix.arch == 'x86_64' && '10.14' || '12.3' }}"
          sed -i.bak -E "s/MACOSX_DEPLOYMENT_TARGET=[0-9.]+/MACOSX_DEPLOYMENT_TARGET=${min}/" build.py
          sed -i.bak -E "s/platform :osx, '[0-9.]+'/platform :osx, '${min}'/" flutter/macos/Podfile
          sed -i.bak -E "s/osx_minimum_system_version = \"[0-9.]+\"/osx_minimum_system_version = \"${min}\"/" Cargo.toml
          sed -i.bak -E "s/MACOSX_DEPLOYMENT_TARGET = [0-9.]+;/MACOSX_DEPLOYMENT_TARGET = ${min};/" flutter/macos/Runner.xcodeproj/project.pbxproj

      - name: Build unsigned macOS clients
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.arch == 'x86_64' && '10.14' || '12.3' }}
        run: bash .github/scripts/build-macos-unsigned.sh "${{ matrix.role }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-macOS-${{ matrix.arch }}-${{ matrix.role }}
          retention-days: 14
          path: dist/macos

  macos-diagnostic:
    name: Verify published soft.6 DMGs on Apple Silicon
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'macos-diagnostic'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Download and check the original published packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "${RUNNER_TEMP}/desk-soft6.XXXXXXXX")"
          trap 'find "${scratch}" -depth -delete' EXIT
          gh release download v1.4.9-soft.6 --repo "${GITHUB_REPOSITORY}" \
            --pattern 'SOFT.Connect.Desk-*-macos-arm64-unsigned.dmg*' --dir "${scratch}"
          failed=0
          for role in Support Operator; do
            dmg="${scratch}/SOFT.Connect.Desk-${role}-macos-arm64-unsigned.dmg"
            checksum="$(awk 'NR==1{print $1}' "${dmg}.sha256")"
            printf '%s  %s\n' "${checksum}" "${dmg}" | shasum -a 256 -c -
            if ! bash .github/scripts/verify-macos-dmg.sh "${dmg}" arm64 1.4.9-soft.6; then
              failed=1
            fi
          done
          exit "${failed}"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - windows-arm64
      - linux
      - linux-arm64
      - flatpak
      - flatpak-arm64
      - archlinux
      - macos
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-downloads

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-soft\.[0-9]+$ ]]; then
            release_channel=stable
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-soft\.[0-9]+-preview\.[0-9]+$ ]]; then
            release_channel=preview
          else
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            echo "Stable:  v1.5.3-soft.1" >&2
            echo "Preview: v1.5.3-soft.1-preview.1" >&2
            exit 2
          fi

          staging="${RUNNER_TEMP}/release-staging"
          mkdir -p "${staging}"

          while IFS= read -r -d '' source_file; do
            file_name="$(basename "${source_file}")"
            destination="${staging}/${file_name}"
            if [[ -e "${destination}" ]]; then
              echo "Duplicate release filename: ${file_name}" >&2
              exit 1
            fi
            cp "${source_file}" "${destination}"
          done < <(
            find release-downloads -type f \
              \( -iname 'SOFT.Connect.Desk-Support-*' -o -iname 'SOFT.Connect.Desk-Operator-*' \) \
              -print0
          )

          if ! find "${staging}" -maxdepth 1 -type f -name 'SOFT.Connect.Desk-Support-*' -print -quit | grep -q .; then
            echo "No Support release files found" >&2
            exit 1
          fi
          if ! find "${staging}" -maxdepth 1 -type f -name 'SOFT.Connect.Desk-Operator-*' -print -quit | grep -q .; then
            echo "No Operator release files found" >&2
            exit 1
          fi

          source_archive="${staging}/SOFT.Connect.Desk-${GITHUB_REF_NAME}-source.tar.gz"
          git ls-files --recurse-submodules -z \
            | tar --null -T - -czf "${source_archive}"

          assets_json="$(
            find "${staging}" -maxdepth 1 -type f \
              \( -name 'SOFT.Connect.Desk-Support-*' -o -name 'SOFT.Connect.Desk-Operator-*' \) \
              -print0 \
              | sort -z \
              | while IFS= read -r -d '' asset; do
                  jq -n \
                    --arg name "$(basename "${asset}")" \
                    --arg sha256 "$(sha256sum "${asset}" | cut -d ' ' -f 1)" \
                    --argjson size "$(stat -c '%s' "${asset}")" \
                    '{name: $name, sha256: $sha256, size: $size}'
                done \
              | jq -s '.'
          )"
          jq -n \
            --arg product "SOFT.Connect.Desk" \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg channel "${release_channel}" \
            --arg release_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --argjson assets "${assets_json}" \
            '{
              schema: 1,
              product: $product,
              version: $version,
              tag: $tag,
              channel: $channel,
              release_url: $release_url,
              assets: $assets
            }' > "${staging}/update-manifest.json"

          (
            cd "${staging}"
            sha256sum SOFT.Connect.Desk-* update-manifest.json > SHA256SUMS.txt
          )

          echo "RELEASE_STAGING=${staging}" >> "${GITHUB_ENV}"
          echo "RELEASE_CHANNEL=${release_channel}" >> "${GITHUB_ENV}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${RELEASE_CHANNEL}" == "preview" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_STAGING}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SOFT.Connect.Desk ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${release_flags[@]}"
