              exit 1
            fi
          done
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" \
            | base64 --decode \
            > flutter/android/app/soft-connect-desk-release.p12
          {
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storeFile=soft-connect-desk-release.p12\n'
          } > flutter/android/key.properties
          declare -A libcxx=(
            [arm64-v8a]=aarch64-linux-android
            [armeabi-v7a]=arm-linux-androideabi
            [x86_64]=x86_64-linux-android
          )
          for abi in arm64-v8a armeabi-v7a x86_64; do
            jni_dir="flutter/android/app/src/main/jniLibs/${abi}"
            mkdir -p "${jni_dir}"
            cp "native/${abi}/liblibrustdesk.so" "${jni_dir}/librustdesk.so"
