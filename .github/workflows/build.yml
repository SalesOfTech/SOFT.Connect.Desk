          done
          sed -i 's/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g' flutter/android/gradle.properties
          mkdir -p "dist/android/${{ matrix.role }}"
          case "${{ matrix.role }}" in
            support) role_name=Support ;;
            operator) role_name=Operator ;;
            *) exit 2 ;;
          esac
          pushd flutter
          flutter build apk --release --target-platform android-arm64,android-arm,android-x64
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/android/${{ matrix.role }}/SOFT.Connect.Desk-${role_name}-android-universal.apk"
          popd

      - name: Upload universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: SOFT.Connect.Desk-Android-${{ matrix.role }}-universal
          retention-days: 14
          path: dist/android/${{ matrix.role }}/*.apk

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - windows-arm64
      - linux
      - linux-arm64
      - flatpak
      - flatpak-arm64
      - archlinux
      - macos
      - android
      - android-universal
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-downloads

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-soft\.[0-9]+$ ]]; then
            release_channel=stable
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-soft\.[0-9]+-preview\.[0-9]+$ ]]; then
            release_channel=preview
          else
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            echo "Stable:  v1.4.9-soft.6" >&2
            echo "Preview: v1.4.9-soft.6-preview.1" >&2
            exit 2
          fi

          staging="${RUNNER_TEMP}/release-staging"
          mkdir -p "${staging}"

          while IFS= read -r -d '' source_file; do
            file_name="$(basename "${source_file}")"
            destination="${staging}/${file_name}"
            if [[ -e "${destination}" ]]; then
              echo "Duplicate release filename: ${file_name}" >&2
              exit 1
            fi
            cp "${source_file}" "${destination}"
          done < <(
            find release-downloads -type f \
              \( -iname 'SOFT.Connect.Desk-Support-*' -o -iname 'SOFT.Connect.Desk-Operator-*' \) \
              -print0
          )

          if ! find "${staging}" -maxdepth 1 -type f -name 'SOFT.Connect.Desk-Support-*' -print -quit | grep -q .; then
            echo "No Support release files found" >&2
            exit 1
          fi
          if ! find "${staging}" -maxdepth 1 -type f -name 'SOFT.Connect.Desk-Operator-*' -print -quit | grep -q .; then
            echo "No Operator release files found" >&2
            exit 1
          fi

          source_archive="${staging}/SOFT.Connect.Desk-${GITHUB_REF_NAME}-source.tar.gz"
          git ls-files --recurse-submodules -z \
            | tar --null -T - -czf "${source_archive}"

          assets_json="$(
            find "${staging}" -maxdepth 1 -type f \
              \( -name 'SOFT.Connect.Desk-Support-*' -o -name 'SOFT.Connect.Desk-Operator-*' \) \
              -print0 \
              | sort -z \
              | while IFS= read -r -d '' asset; do
                  jq -n \
                    --arg name "$(basename "${asset}")" \
                    --arg sha256 "$(sha256sum "${asset}" | cut -d ' ' -f 1)" \
                    --argjson size "$(stat -c '%s' "${asset}")" \
                    '{name: $name, sha256: $sha256, size: $size}'
                done \
              | jq -s '.'
          )"
          jq -n \
            --arg product "SOFT.Connect.Desk" \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg tag "${GITHUB_REF_NAME}" \
            --arg channel "${release_channel}" \
            --arg release_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --argjson assets "${assets_json}" \
            '{
              schema: 1,
              product: $product,
              version: $version,
              tag: $tag,
              channel: $channel,
              release_url: $release_url,
              assets: $assets
            }' > "${staging}/update-manifest.json"

          (
            cd "${staging}"
            sha256sum SOFT.Connect.Desk-* update-manifest.json > SHA256SUMS.txt
          )

          echo "RELEASE_STAGING=${staging}" >> "${GITHUB_ENV}"
          echo "RELEASE_CHANNEL=${release_channel}" >> "${GITHUB_ENV}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${RELEASE_CHANNEL}" == "preview" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_STAGING}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SOFT.Connect.Desk ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${release_flags[@]}"
