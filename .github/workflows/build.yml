      - name: Restore bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge
          path: .

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Patch Flutter
        shell: bash
        run: |
          flutter_root="$(cd "$(dirname "$(which flutter)")/.." && pwd)"
          patch_file="${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          if git -C "${flutter_root}" apply --check "${patch_file}" 2>/dev/null; then
            git -C "${flutter_root}" apply "${patch_file}"
          fi

      - name: Install Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Download ARM64 library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: SOFT.Connect.Desk-Android-lib-${{ matrix.role }}-aarch64-linux-android
          path: native/arm64-v8a

      - name: Download ARMv7 library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: SOFT.Connect.Desk-Android-lib-${{ matrix.role }}-armv7-linux-androideabi
          path: native/armeabi-v7a

      - name: Download x86_64 library
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: SOFT.Connect.Desk-Android-lib-${{ matrix.role }}-x86_64-linux-android
          path: native/x86_64

      - name: Package universal APK
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
