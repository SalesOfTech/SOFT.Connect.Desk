[package]
name = "rustdesk-portable-packer"
version = "1.4.9"
edition = "2021"
description = "SOFT.Connect.Desk portable launcher"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"

[dependencies]
brotli = "3.4"
dirs = "5.0"
md5 = "0.7"
winapi = { version = "0.3", features = ["winbase"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Wdk",
    "Wdk_System",
    "Wdk_System_SystemServices",
    "Win32",
    "Win32_System",
    "Win32_System_SystemInformation",
] }
native-windows-gui = {version = "1.0", default-features = false, features = ["animation-timer", "image-decoder"]}

[package.metadata.winres]
LegalCopyright = "Copyright © 2026 Sales Of Tech. Licensed under AGPL-3.0."
CompanyName = "Sales Of Tech"
ProductName = "SOFT.Connect.Desk"
OriginalFilename = "SOFT.Connect.Desk.exe"
FileDescription = "SOFT.Connect.Desk Remote Support"
#ProductVersion = ""

[target.'cfg(target_os="windows")'.build-dependencies]
winres = "0.1"
winapi = { version = "0.3", features = [ "winnt", "pdh", "synchapi" ] }


